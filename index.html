<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wet Bulb">
<meta name="theme-color" content="#0E1420">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Wet Bulb Temperature</title>
<style>
  @font-face {
    font-family: 'Sora'; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url('fonts/sora-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/plexmono-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('fonts/plexmono-500-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('fonts/plexmono-600-latin.woff2') format('woff2');
  }

  :root {
    --bg: #0E1420;
    --bg2: #131C2C;
    --ink: #E9EEF6;
    --muted: #8B97AB;
    --line: rgba(139,151,171,0.18);
    --accent: #4FD1B5; /* wordt dynamisch gezet per risiconiveau */
    --accent-dim: rgba(79,209,181,0.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background-color:#0E1420; }
  body {
    background: radial-gradient(120% 90% at 50% -10%, var(--accent-dim) 0%, var(--bg) 55%) fixed;
    color: var(--ink);
    font-family: 'Sora', -apple-system, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; flex-direction: column;
    min-height: 100svh;
    transition: background 0.8s ease;
  }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow {
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--muted);
  }
  .loc { font-size:13px; color:var(--muted); text-align:right; max-width:55%; }

  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }

  .gauge-wrap { position:relative; width:min(78vw, 300px); aspect-ratio:1; }
  svg { width:100%; height:100%; transform:rotate(135deg); }
  .arc-bg { stroke: var(--line); }
  .arc-val { stroke: var(--accent); transition: stroke-dashoffset 0.9s cubic-bezier(.3,.8,.3,1), stroke 0.8s ease; }
  .readout {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .tw {
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size: clamp(52px, 17vw, 76px); line-height:1; letter-spacing:-0.03em;
    font-variant-numeric: tabular-nums;
  }
  .tw .unit { font-size:0.34em; font-weight:500; color:var(--muted); letter-spacing:0; }
  .tw-label { font-size:12px; color:var(--muted); }

  .risk {
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
    letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent);
    border-radius:999px; padding:7px 16px;
    transition: color 0.8s ease, border-color 0.8s ease;
  }
  .risk-note { margin-top:12px; font-size:13.5px; line-height:1.5; color:var(--muted); text-align:center; max-width:34ch; }

  .grid {
    display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; margin-top:26px; width:100%;
  }
  .cell { background:var(--bg2); padding:14px 16px; }
  .cell .k { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .cell .v {
    font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:500; margin-top:4px;
    font-variant-numeric: tabular-nums;
  }
  .cell .v small { font-size:12px; color:var(--muted); font-weight:400; }

  footer { margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  button {
    font-family:'Sora', sans-serif; font-size:14px; font-weight:600;
    color:var(--bg); background:var(--ink); border:none; border-radius:12px;
    padding:13px 26px; width:100%; cursor:pointer;
  }
  button:active { opacity:0.8; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .stamp { font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); }
  .attribution { font-size:10px; opacity:0.7; }

  .state { text-align:center; color:var(--muted); font-size:14px; line-height:1.6; padding:0 10px; }
  .hidden { display:none; }
  @media (prefers-reduced-motion: reduce) {
    .arc-val, body, .risk { transition:none; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Wet Bulb Temperature</div>
    </div>
    <div class="loc" id="loc"></div>
  </header>

  <main id="main">
    <div class="state" id="state">Locatie bepalen…</div>

    <div id="result" class="hidden" style="display:contents;">
      <div class="gauge-wrap">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="arc-bg" cx="50" cy="50" r="44" fill="none" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="207.3 276.5"/>
          <circle class="arc-val" id="arcVal" cx="50" cy="50" r="44" fill="none" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="207.3 276.5" stroke-dashoffset="207.3"/>
        </svg>
        <div class="readout">
          <div class="tw"><span id="twVal">–</span><span class="unit"> °C</span></div>
          <div class="tw-label">wet bulb (Tw)</div>
        </div>
      </div>

      <div class="risk" id="riskChip">–</div>
      <div class="risk-note" id="riskNote"></div>

      <div class="grid">
        <div class="cell"><div class="k">Temperatuur</div><div class="v" id="t">–</div></div>
        <div class="cell"><div class="k">Luchtvochtigheid</div><div class="v" id="rh">–</div></div>
        <div class="cell"><div class="k">Gevoelstemperatuur</div><div class="v" id="app">–</div></div>
        <div class="cell"><div class="k">Dauwpunt</div><div class="v" id="dp">–</div></div>
      </div>
    </div>
  </main>

  <footer>
    <button id="refresh" type="button">Vernieuwen</button>
    <div class="stamp" id="stamp"></div>
    <div class="stamp attribution">Grenzen indicatief · o.a. Sherwood &amp; Huber (2010), Vecellio et al. (2022)</div>
  </footer>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ARC_LEN = 207.3; // 3/4 cirkel
  var TW_MIN = 0, TW_MAX = 40;
  var CACHE_KEY = 'wbt:last';
  var lastStamp = '';

  // Risiconiveaus op basis van wet bulb temperature
  var LEVELS = [
    { max: 23, label: 'Veilig', color: '#4FD1B5', dim: 'rgba(79,209,181,0.14)',
      note: 'Het lichaam kan warmte goed kwijt via zweten.' },
    { max: 28, label: 'Oppassen', color: '#E8C158', dim: 'rgba(232,193,88,0.13)',
      note: 'Zware inspanning wordt belastend. Drink voldoende en zoek regelmatig schaduw.' },
    { max: 31, label: 'Gevaarlijk', color: '#F08A4B', dim: 'rgba(240,138,75,0.14)',
      note: 'Risico op oververhitting bij inspanning, ook voor gezonde mensen. Beperk activiteit buiten.' },
    { max: 35, label: 'Zeer gevaarlijk', color: '#E85454', dim: 'rgba(232,84,84,0.15)',
      note: 'Ook in rust kan het lichaam warmte nauwelijks kwijt. Blijf in een gekoelde omgeving.' },
    { max: Infinity, label: 'Levensbedreigend', color: '#FF3B3B', dim: 'rgba(255,59,59,0.18)',
      note: 'Boven ~35 °C wet bulb is overleven zonder koeling niet mogelijk. Zoek direct verkoeling.' }
  ];

  // Stull (2011) benadering, fallback als API geen Tw levert
  function stull(T, RH){
    return T * Math.atan(0.151977 * Math.sqrt(RH + 8.313659))
      + Math.atan(T + RH) - Math.atan(RH - 1.676331)
      + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH)
      - 4.686035;
  }

  function fmt(n){ return (Math.round(n * 10) / 10).toLocaleString('nl-NL', {minimumFractionDigits:1, maximumFractionDigits:1}); }

  function setLevel(tw){
    var lvl = LEVELS.find(function(l){ return tw < l.max; });
    document.documentElement.style.setProperty('--accent', lvl.color);
    document.documentElement.style.setProperty('--accent-dim', lvl.dim);
    $('riskChip').textContent = lvl.label;
    $('riskNote').textContent = lvl.note;
  }

  function setGauge(tw){
    var frac = Math.min(1, Math.max(0, (tw - TW_MIN) / (TW_MAX - TW_MIN)));
    $('arcVal').style.strokeDashoffset = String(ARC_LEN * (1 - frac));
  }

  function stampText(iso){
    var d = new Date(iso);
    var time = d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
    var sameDay = d.toDateString() === new Date().toDateString();
    var when = sameDay ? time : d.toLocaleDateString('nl-NL', {day:'numeric', month:'short'}) + ' ' + time;
    return 'Meting ' + when + ' · Open-Meteo';
  }

  function show(data, placeName){
    var c = data.current;
    var tw = c.wet_bulb_temperature_2m;
    if (tw == null || isNaN(tw)) tw = stull(c.temperature_2m, c.relative_humidity_2m);

    $('twVal').textContent = fmt(tw);
    $('t').innerHTML = fmt(c.temperature_2m) + ' <small>°C</small>';
    $('rh').innerHTML = Math.round(c.relative_humidity_2m) + ' <small>%</small>';
    $('app').innerHTML = fmt(c.apparent_temperature) + ' <small>°C</small>';
    $('dp').innerHTML = fmt(c.dew_point_2m) + ' <small>°C</small>';
    setLevel(tw);
    setGauge(tw);

    if (placeName) $('loc').textContent = placeName;
    lastStamp = stampText(c.time);
    $('stamp').textContent = lastStamp;

    $('state').classList.add('hidden');
    $('result').classList.remove('hidden');
  }

  function saveLast(data, placeName){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        current: data.current,
        place: placeName || $('loc').textContent || ''
      }));
    } catch(e){}
  }

  function showLast(){
    try {
      var saved = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (saved && saved.current){ show({current: saved.current}, saved.place); }
    } catch(e){}
  }

  function fail(msg){
    if (!$('result').classList.contains('hidden')){
      // Er staat nog een eerdere meting; laat die staan en meld alleen dat verversen niet lukte.
      $('stamp').textContent = lastStamp + ' · niet bijgewerkt';
      return;
    }
    $('state').classList.remove('hidden');
    $('state').textContent = msg;
  }

  function load(){
    var hasData = !$('result').classList.contains('hidden');
    if (hasData){
      $('stamp').textContent = 'Vernieuwen…';
    } else {
      $('state').classList.remove('hidden');
      $('state').textContent = 'Locatie bepalen…';
    }

    if (!navigator.geolocation){
      fail('Geolocatie wordt niet ondersteund door deze browser.');
      return;
    }

    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (!hasData) $('state').textContent = 'Weerdata ophalen…';

      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat + '&longitude=' + lon
        + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,dew_point_2m,wet_bulb_temperature_2m'
        + '&timezone=auto';

      var weather = fetch(url).then(function(r){
        if (!r.ok) throw new Error('API-fout ' + r.status);
        return r.json();
      });

      var place = fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat +
          '&longitude=' + lon + '&localityLanguage=nl')
        .then(function(r){ return r.json(); })
        .then(function(g){ return g.locality || g.city || g.principalSubdivision || ''; })
        .catch(function(){ return ''; });

      Promise.all([weather, place]).then(function(res){
        show(res[0], res[1]);
        saveLast(res[0], res[1]);
      }).catch(function(e){
        // Tweede poging zonder wet_bulb-variabele (voor het geval de API die weigert)
        var url2 = 'https://api.open-meteo.com/v1/forecast'
          + '?latitude=' + lat + '&longitude=' + lon
          + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,dew_point_2m'
          + '&timezone=auto';
        fetch(url2).then(function(r){ return r.json(); })
          .then(function(d){ show(d, ''); saveLast(d, ''); })
          .catch(function(){ fail('Weerdata ophalen mislukt. Controleer je internetverbinding en probeer opnieuw.'); });
      });
    }, function(err){
      if (err.code === 1) fail('Geen toegang tot locatie. Sta locatietoegang toe via Instellingen > Privacy > Locatievoorzieningen > Safari.');
      else fail('Locatie bepalen mislukt. Probeer het opnieuw.');
    }, { enableHighAccuracy:false, timeout:15000, maximumAge:300000 });
  }

  $('refresh').addEventListener('click', load);
  showLast();
  load();

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
