<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#131C2C"/>
      <stop offset="1" stop-color="#0E1420"/>
    </radialGradient>
  </defs>

  <!-- opaque background, full canvas -->
  <rect width="512" height="512" fill="#0E1420"/>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- scale ticks (muted), 32px pitch, aligned to tube top -->
  <g stroke="#8B97AB" stroke-width="20" stroke-linecap="round">
    <line x1="304" y1="118" x2="332" y2="118"/>
    <line x1="304" y1="150" x2="332" y2="150"/>
    <line x1="304" y1="214" x2="332" y2="214"/>
    <line x1="304" y1="246" x2="332" y2="246"/>
    <line x1="304" y1="278" x2="332" y2="278"/>
    <line x1="304" y1="310" x2="332" y2="310"/>
  </g>

  <!-- teal accent tick at the current value (liquid level y=182) -->
  <line x1="304" y1="182" x2="352" y2="182" stroke="#4FD1B5" stroke-width="20" stroke-linecap="round"/>

  <!-- red core: liquid column + bulb -->
  <line x1="232" y1="182" x2="232" y2="370" stroke="#E85454" stroke-width="24" stroke-linecap="round"/>
  <circle cx="232" cy="370" r="39" fill="#E85454"/>

  <!-- glass outline: capsule tube merging into bulb (single path) -->
  <path d="M 199 319.9 L 199 118 A 33 33 0 0 1 265 118 L 265 319.9 A 60 60 0 1 1 199 319.9 Z"
        fill="none" stroke="#E9EEF6" stroke-width="22" stroke-linejoin="round"/>
</svg>
